openapi: 3.0.1

info:
  title: AppointmentService
  description: API for managing appointments exposed via WSO2 API Manager.
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: http://localhost
    description: Placeholder (actual backend configured in Publisher)

tags:
  - name: appointments
    description: Appointment operations

paths:
  /appointmentservices/getAppointment:
    get:
      tags:
        - appointments
      summary: Get appointment details
      description: Retrieve appointment information by ID
      operationId: getAppointment
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Appointment retrieved
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '500':
          description: Server error

  /appointmentservices/setAppointment:
    put:
      tags:
        - appointments
      summary: Create or update an appointment
      description: Create a new appointment or update an existing one
      operationId: setAppointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                appointmentId:
                  type: string
                date:
                  type: string
                  format: date
                patientName:
                  type: string
      responses:
        '200':
          description: Appointment saved
        '400':
          description: Invalid input
        '500':
          description: Server error

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://wso2am:9443/oauth2/token
          scopes: {}

security:
  - OAuth2: []
